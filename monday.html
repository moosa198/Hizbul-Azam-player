<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5faf6">
  <title>Monday — Hizbul-Azam</title>
  <link rel="stylesheet" href="style.css">
  <script src="pdf-viewer.js" defer></script>
</head>
<body class="page">
  <header class="topbar">
    <a class="home-link" href="index.html">← All days</a>
    <div class="day-heading">
      <span class="current-day">Monday</span>
      <span class="day-count">3 of 7</span>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar" aria-label="Daily portions">
      <div class="sidebar-label">Daily portions</div>
      <a href="saturday.html">Saturday</a><a href="sunday.html">Sunday</a><a href="monday.html" class="active" aria-current="page">Monday</a><a href="tuesday.html">Tuesday</a><a href="wednesday.html">Wednesday</a><a href="thursday.html">Thursday</a><a href="friday.html">Friday</a>
    </aside>

    <main class="reader">
      <div class="reader-header">
        <p class="reader-title">Monday portion</p>
        <p class="reader-help"><span id="current-page">1</span> / <span id="total-pages">—</span> pages</p>
      </div>
      <div class="reading-progress" aria-hidden="true"><span id="reading-progress"></span></div>

      <div id="pdf-viewer" class="pdf-viewer" data-pdf="pdfs/monday.pdf" aria-label="Monday PDF">
        <div id="pdf-status" class="pdf-status">Loading Monday portion…</div>
      </div>

      <p id="pdf-fallback" class="pdf-fallback" hidden>
        The reader could not display the PDF. <a href="pdfs/monday.pdf">Open the Monday PDF</a> instead.
      </p>

      <nav class="day-actions" aria-label="Portion navigation">
        <a class="day-action" href="sunday.html">← Sunday</a>
        <a class="day-action home-action" href="index.html">All days</a>
        <a class="day-action primary" href="tuesday.html">Tuesday →</a>
      </nav>
    </main>
  </div>

  <footer class="player">
    <div class="player-inner">
      <div class="player-title">Monday audio<small>Listen while you read</small></div>
      <audio controls preload="metadata" aria-label="Monday audio">
        <source src="audio/monday.mp3" type="audio/mpeg">
        Your browser does not support audio playback.
      </audio>
    </div>
  </footer>
</body>
</html>
