<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f4ec">
  <title>Hizbul-Azam</title>
  <link rel="stylesheet" href="style.css?v=18">
  <link rel="stylesheet" href="completion.css?v=2">
  <link rel="manifest" href="manifest.webmanifest?v=11">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/hizbul-azam-favicon.svg?v=11">
  <link rel="apple-touch-icon" href="icons/hizbul-azam-icon.svg?v=11">
  <script>try{var t=localStorage.getItem("hizbulAzam:theme");if(t==="dark"||t==="light")document.documentElement.dataset.theme=t;}catch(e){}</script>
  <script src="app.js?v=19" defer></script>
</head>
<body>
  <main class="home">
    <header class="home-header">
      <h1 class="home-arabic home-title" lang="ar" dir="rtl">الحزب الأعظم</h1>
      <p class="home-english">Hizbul-Azam</p>
      <div class="ornament" aria-hidden="true"><span class="ornament-mark"></span></div>
    </header>

    <section class="home-tools" aria-label="Quick access" hidden id="continue-card">
      <a class="continue-card" data-continue-link href="saturday.html">
        <span class="continue-label" data-continue-label>Continue your reading</span>
        <span class="continue-arrow" aria-hidden="true">→</span>
      </a>
    </section>

    <section class="install-card" id="install-card" hidden>
      <div>
        <strong>Keep Hizbul-Azam close</strong>
        <span>Add it to your device for a more app-like experience.</span>
      </div>
      <button id="install-button" type="button">Install</button>
    </section>

    <nav class="day-grid" aria-label="Daily portions">
      <a class="day-tile" data-day="saturday" href="saturday.html" data-audio="audio/saturday.mp3"><span class="day-number">01</span><span class="day-name">Saturday</span><small data-duration aria-label="Estimated audio time">Audio time</small><span class="day-progress" data-day-progress>0%</span></a>
      <a class="day-tile" data-day="sunday" href="sunday.html" data-audio="audio/sunday.mp3"><span class="day-number">02</span><span class="day-name">Sunday</span><small data-duration aria-label="Estimated audio time">Audio time</small><span class="day-progress" data-day-progress>0%</span></a>
      <a class="day-tile" data-day="monday" href="monday.html" data-audio="audio/monday.mp3"><span class="day-number">03</span><span class="day-name">Monday</span><small data-duration aria-label="Estimated audio time">Audio time</small><span class="day-progress" data-day-progress>0%</span></a>
      <a class="day-tile" data-day="tuesday" href="tuesday.html" data-audio="audio/tuesday.mp3"><span class="day-number">04</span><span class="day-name">Tuesday</span><small data-duration aria-label="Estimated audio time">Audio time</small><span class="day-progress" data-day-progress>0%</span></a>
      <a class="day-tile" data-day="wednesday" href="wednesday.html" data-audio="audio/wednesday.mp3"><span class="day-number">05</span><span class="day-name">Wednesday</span><small data-duration aria-label="Estimated audio time">Audio time</small><span class="day-progress" data-day-progress>0%</span></a>
      <a class="day-tile" data-day="thursday" href="thursday.html" data-audio="audio/thursday.mp3"><span class="day-number">06</span><span class="day-name">Thursday</span><small data-duration aria-label="Estimated audio time">Audio time</small><span class="day-progress" data-day-progress>0%</span></a>
      <a class="day-tile" data-day="friday" href="friday.html" data-audio="audio/friday.mp3"><span class="day-number">07</span><span class="day-name">Friday</span><small data-duration aria-label="Estimated audio time">Audio time</small><span class="day-progress" data-day-progress>0%</span></a>
    </nav>
  </main>
</body>
</html>
